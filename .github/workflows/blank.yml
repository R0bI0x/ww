# .github/workflows/main.yml
name: Windows RDP via Ngrok - Advanced

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durasi sesi (jam, max 6)'
        required: true
        default: '6'
        type: string
      enable_http_tunnel:
        description: 'Aktifkan HTTP tunnel tambahan (untuk file sharing)'
        required: true
        default: true
        type: boolean
      notify_discord:
        description: 'Kirim info koneksi ke Discord webhook'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  RDP_USER: admin
  RDP_PASS: ${{ secrets.RDP_PASS }}
  DURATION_HOURS: ${{ inputs.duration_hours }}
  ENABLE_HTTP_TUNNEL: ${{ inputs.enable_http_tunnel }}
  NOTIFY_DISCORD: ${{ inputs.notify_discord }}

jobs:
  ngrok-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Validate Configuration
      shell: pwsh
      run: |
        Write-Host "::group::Validasi Konfigurasi"

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
          "RDP_PASS=p@ssw0rd!" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:RDP_PASS = "p@ssw0rd!"
          Write-Host "RDP_PASS tidak di-set, pakai default."
        }

        $errors = @()

        if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
          $errors += "NGROK_AUTH_TOKEN tidak di-set di Secrets!"
        }

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
          $errors += "RDP_PASS kosong!"
        }

        $dur = [int]$env:DURATION_HOURS
        if ($dur -lt 1 -or $dur -gt 6) {
          Write-Host "::warning::Durasi $dur jam di luar rentang 1-6 jam. Akan di-clamp ke 6 jam."
          $dur = [math]::Min([math]::Max($dur, 1), 6)
          "DURATION_HOURS=$dur" | Out-File -FilePath $env:GITHUB_ENV -Append
        }

        Write-Host "Runner OS       : $env:RUNNER_OS"
        Write-Host "Runner Arch     : $env:RUNNER_ARCH"
        Write-Host "RDP User        : $env:RDP_USER"
        Write-Host "Durasi          : $dur jam"
        Write-Host "HTTP Tunnel     : $env:ENABLE_HTTP_TUNNEL"
        Write-Host "Notif Discord   : $env:NOTIFY_DISCORD"

        if ($errors.Count -gt 0) {
          foreach ($e in $errors) { Write-Host "::error::$e" }
          exit 1
        }

        Write-Host "Validasi berhasil."
        Write-Host "::endgroup::"

    - name: System Optimization and Info
      shell: pwsh
      run: |
        Write-Host "::group::Informasi Sistem"
        Write-Host "OS          : $((Get-CimInstance Win32_OperatingSystem).Caption)"
        Write-Host "CPU         : $((Get-CimInstance Win32_Processor).Name)"
        Write-Host "Cores       : $((Get-CimInstance Win32_Processor).NumberOfCores)"
        Write-Host "RAM         : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)) GB"
        Write-Host "Free Disk C : $([math]::Round((Get-PSDrive C).Free / 1GB, 2)) GB"
        Write-Host "::endgroup::"

        Write-Host "::group::Optimasi Sistem"
        Set-Service -Name "wuauserv" -StartupType Disabled -ErrorAction SilentlyContinue
        Stop-Service -Name "wuauserv" -Force -ErrorAction SilentlyContinue

        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          Write-Host "Windows Defender realtime protection dimatikan."
        } catch {
          Write-Host "Tidak bisa mematikan Defender (mungkin diproteksi)."
        }

        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
        Write-Host "Power plan diset ke High Performance."

        powercfg /hibernate off 2>$null
        Write-Host "Hibernasi dimatikan."
        Write-Host "::endgroup::"

    - name: Setup Windows Remote Desktop
      shell: pwsh
      run: |
        Write-Host "::group::Setup RDP"
        Write-Host "::add-mask::$env:RDP_PASS"

        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        if ("$env:RDP_USER" -eq "runneradmin") {
          Write-Host "Warning: Menggunakan default user account!"
          Set-LocalUser -Name $env:RDP_USER -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
        } else {
          $existingUser = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue
          if ($existingUser) {
            Write-Host "User $env:RDP_USER sudah ada, update password."
            Set-LocalUser -Name "$env:RDP_USER" -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
          } else {
            New-LocalUser -Name "$env:RDP_USER" -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force) *>$null
            Add-LocalGroupMember -Group "Administrators" -Member "$env:RDP_USER"
            Enable-LocalUser -Name "$env:RDP_USER"
            Write-Host "User $env:RDP_USER dibuat dan ditambahkan ke Administrators."
          }
        }

        icacls "C:\Windows\Temp" /grant "$env:RDP_USER`:F" *>$null
        icacls "C:\Windows\installer" /grant "$env:RDP_USER`:F" *>$null

        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxDisconnectionTime" -Value 0 -ErrorAction SilentlyContinue

        Write-Host "Setup RDP selesai."
        Write-Host "::endgroup::"

    - name: Time Synchronization
      shell: pwsh
      run: |
        Write-Host "::group::Sinkronisasi Waktu"
        Set-Service -Name "W32Time" -StartupType Automatic -ErrorAction Stop *>$null
        Restart-Service W32Time *>$null
        w32tm /resync /force *>$null
        w32tm /config /manualpeerlist:"time.windows.com,time.google.com" /syncfromflags:manual /reliable:yes /update *>$null
        Restart-Service W32Time *>$null
        Start-Sleep -Seconds 3
        $time = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss")
        Write-Host "Waktu sistem: $time"
        Write-Host "::endgroup::"

    - name: Cleanup Temp Files
      shell: pwsh
      run: |
        Write-Host "::group::Cleanup Temp Files"

        $paths = @(
          "$env:TEMP\*",
          "C:\Windows\Temp\*",
          "C:\Windows\Prefetch\*",
          "C:\Users\Public\Desktop\*"
        )

        foreach ($p in $paths) {
          Write-Host "Membersihkan $p ..."
          Get-ChildItem $p -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }

        (New-Object -ComObject Shell.Application).Namespace(0xA).Items() |
          ForEach-Object { Remove-Item $_.Path -Recurse -Force -Confirm:$false -ErrorAction SilentlyContinue }

        (New-Object -ComObject Shell.Application).minimizeall()

        diskperf -Y *>$null
        Write-Host "Cleanup selesai."
        Write-Host "::endgroup::"

    - name: Install and Configure Ngrok
      shell: pwsh
      run: |
        Write-Host "::group::Instalasi Ngrok"
        Write-Host "::add-mask::$env:NGROK_AUTH_TOKEN"

        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .\ngrok -Force

        Write-Host "Versi ngrok:"
        .\ngrok\ngrok.exe --version

        Write-Host "Konfigurasi authtoken..."
        .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::Autentikasi ngrok gagal! Periksa NGROK_AUTH_TOKEN."
          exit 1
        }

        Write-Host "Autentikasi ngrok berhasil."
        Write-Host "::endgroup::"

    - name: Allow Ngrok Through Firewall
      shell: pwsh
      run: |
        Write-Host "::group::Konfigurasi Firewall"
        $ngrokPath = "$PWD\ngrok\ngrok.exe"

        New-NetFirewallRule -DisplayName "Allow Ngrok Outbound" -Direction Outbound -Program $ngrokPath -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Allow Ngrok Inbound" -Direction Inbound -Program $ngrokPath -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Allow RDP 3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

        Write-Host "Firewall rules ditambahkan."
        Write-Host "::endgroup::"

    - name: Start Ngrok TCP Tunnel
      id: rdp_tunnel
      shell: pwsh
      run: |
        Write-Host "::group::Start Ngrok TCP Tunnel"
        $maxRetries = 3
        $retryCount = 0
        $success = $false
        $rdpInfo = @{}

        while (-not $success -and $retryCount -lt $maxRetries) {
          Write-Host "--- Percobaan ke-$(($retryCount + 1)) dari $maxRetries ---"

          Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "ngrok_log.txt","ngrok_err.txt" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "Menjalankan ngrok tunnel tcp 3389..."
          $ngrokProc = Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout --log-format=logfmt" -WindowStyle Hidden -PassThru -RedirectStandardOutput "ngrok_log.txt" -RedirectStandardError "ngrok_err.txt"

          Start-Sleep -Seconds 10

          if ($ngrokProc.HasExited) {
            Write-Host "::error::Proses ngrok mati tak lama setelah dijalankan."
            Write-Host "--- Log stdout ---"
            Get-Content "ngrok_log.txt" -ErrorAction SilentlyContinue
            Write-Host "--- Log stderr ---"
            Get-Content "ngrok_err.txt" -ErrorAction SilentlyContinue
            $retryCount++
            Start-Sleep -Seconds 5
            continue
          }

          $attempts = 0
          $maxAttempts = 10
          $ngrokUrl = $null

          while (-not $ngrokUrl -and $attempts -lt $maxAttempts) {
            Start-Sleep -Seconds 5
            $attempts++
            try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 10 -ErrorAction Stop
              $ngrokUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'tcp' }).public_url
              if ($ngrokUrl) {
                Write-Host "URL ngrok diperoleh: $ngrokUrl"
              }
            } catch {
              Write-Host "Percobaan $attempts`: Menunggu API ngrok... ($($_.Exception.Message))"
            }
          }

          if (-not $ngrokUrl) {
            Write-Host "Gagal mendapatkan URL ngrok setelah $maxAttempts percobaan."
            Get-Content "ngrok_log.txt" -ErrorAction SilentlyContinue
            Get-Content "ngrok_err.txt" -ErrorAction SilentlyContinue
            Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
            $retryCount++
            Start-Sleep -Seconds 5
            continue
          }

          $cleanUrl = $ngrokUrl -replace "^tcp://", ""
          $address, $port = $cleanUrl -split ":"
          Write-Host "Menguji koneksi ke $address`:$port ..."
          $testResult = Test-NetConnection -ComputerName $address -Port $port -WarningAction SilentlyContinue

          if ($testResult.TcpTestSucceeded) {
            $success = $true
            $rdpInfo = @{
              Host = $address
              Port = $port
            }
            Write-Host "Koneksi RDP berhasil!"
          } else {
            Write-Host "Tes koneksi gagal. Mencoba ulang..."
            Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
            $retryCount++
            Start-Sleep -Seconds 5
          }
        }

        if (-not $success) {
          Write-Host "::error::Gagal membuat tunnel ngrok setelah $maxRetries percobaan."
          exit 1
        }

        "RDP_HOST=$($rdpInfo.Host)" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RDP_PORT=$($rdpInfo.Port)" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RDP_FULL_ADDRESS=$($rdpInfo.Host):$($rdpInfo.Port)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        Write-Host "::endgroup::"

    - name: Start Ngrok HTTP Tunnel
      if: ${{ inputs.enable_http_tunnel }}
      id: http_tunnel
      shell: pwsh
      run: |
        Write-Host "::group::Start Ngrok HTTP Tunnel"

        $shareDir = "C:\RDP_Share"
        New-Item -ItemType Directory -Path $shareDir -Force | Out-Null
        "Selamat datang di RDP Share!" | Out-File "$shareDir\README.txt"

        Write-Host "Membuat HTTP server di port 8080..."
        $pythonProc = Start-Process -FilePath "python" -ArgumentList "-m http.server 8080 --directory `"$shareDir`"" -WindowStyle Hidden -PassThru

        Start-Sleep -Seconds 3

        Write-Host "Menambahkan HTTP tunnel via API ngrok..."
        $body = @{
          addr = "8080"
          proto = "http"
          name = "fileshare"
        } | ConvertTo-Json

        try {
          $null = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -Method Post -Body $body -ContentType "application/json" -ErrorAction Stop
          Start-Sleep -Seconds 5

          $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
          $httpUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'http' }).public_url

          if ($httpUrl) {
            "HTTP_TUNNEL_URL=$httpUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
            "HTTP_TUNNEL_URL=$httpUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "HTTP Tunnel: $httpUrl"
          } else {
            Write-Host "::warning::HTTP tunnel tidak bisa dibuat."
          }
        } catch {
          Write-Host "::warning::Gagal membuat HTTP tunnel: $($_.Exception.Message)"
        }

        Write-Host "::endgroup::"

    - name: Display Connection Info
      shell: pwsh
      run: |
        Write-Host "::add-mask::$env:RDP_PASS"
        $sep = "=" * 60
        Write-Host $sep
        Write-Host "  WINDOWS RDP SIAP DIGUNAKAN"
        Write-Host $sep
        Write-Host "  Host         : $env:RDP_HOST"
        Write-Host "  Port         : $env:RDP_PORT"
        Write-Host "  Full Address : $env:RDP_FULL_ADDRESS"
        Write-Host "  Username     : $env:RDP_USER"
        Write-Host "  Password     : $env:RDP_PASS"
        Write-Host ""

        if ($env:HTTP_TUNNEL_URL) {
          Write-Host "  File Sharing (HTTP)"
          Write-Host "  URL          : $env:HTTP_TUNNEL_URL"
          Write-Host "  Folder       : C:\RDP_Share"
          Write-Host ""
        }

        Write-Host "  Durasi       : $env:DURATION_HOURS jam"
        Write-Host ""
        Write-Host "  Cara connect:"
        Write-Host "     1. Buka Remote Desktop Client (mstsc)"
        Write-Host "     2. Masukkan: $env:RDP_FULL_ADDRESS"
        Write-Host "     3. Login dengan user: $env:RDP_USER"
        Write-Host $sep

        $lines = @(
          ("=" * 60),
          "WINDOWS RDP CONNECTION INFO",
          ("=" * 60),
          "Host         : $env:RDP_HOST",
          "Port         : $env:RDP_PORT",
          "Full Address : $env:RDP_FULL_ADDRESS",
          "Username     : $env:RDP_USER",
          "Password     : $env:RDP_PASS",
          "HTTP Tunnel  : $env:HTTP_TUNNEL_URL",
          "Duration     : $env:DURATION_HOURS jam",
          "Generated    : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')",
          ("=" * 60)
        )
        $lines -join "`n" | Out-File -FilePath "rdp-info.txt" -Encoding UTF8

    - name: Send Discord Notification
      if: ${{ inputs.notify_discord && env.DISCORD_WEBHOOK != '' }}
      shell: pwsh
      run: |
        Write-Host "Mengirim notifikasi ke Discord..."

        $payload = @{
          username = "RDP Bot"
          embeds = @(
            @{
              title = "Windows RDP Siap Digunakan"
              color = 3066993
              fields = @(
                @{ name = "Host"; value = "$env:RDP_HOST"; inline = $true },
                @{ name = "Port"; value = "$env:RDP_PORT"; inline = $true },
                @{ name = "Username"; value = "$env:RDP_USER"; inline = $true },
                @{ name = "Password"; value = "||$env:RDP_PASS||"; inline = $true },
                @{ name = "Durasi"; value = "$env:DURATION_HOURS jam"; inline = $true }
              )
              footer = @{ text = "GitHub Actions - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" }
            }
          )
        } | ConvertTo-Json -Depth 10

        try {
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $payload -ContentType "application/json" -ErrorAction Stop
          Write-Host "Notifikasi Discord terkirim."
        } catch {
          Write-Host "::warning::Gagal kirim Discord: $($_.Exception.Message)"
        }

    - name: Upload Connection Info
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rdp-connection-info
        path: rdp-info.txt
        retention-days: 1

    - name: Keep Alive
      shell: pwsh
      run: |
        Write-Host "::group::Keep Alive"
        $duration = ([int]$env:DURATION_HOURS) * 3600
        $interval = 60
        $endTime = (Get-Date).AddSeconds($duration)
        $lastStatus = ""

        Write-Host "Menjaga sesi tetap hidup selama $env:DURATION_HOURS jam..."
        Write-Host "Berakhir pada: $($endTime.ToString('yyyy-MM-dd HH:mm:ss'))"

        while ((Get-Date) -lt $endTime) {
          $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue

          if (-not $ngrokProcess) {
            Write-Host "::error::Proses ngrok mati! Mencoba restart..."

            try {
              $ngrokProc = Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -WindowStyle Hidden -PassThru -RedirectStandardOutput "ngrok_recover.txt" -RedirectStandardError "ngrok_recover_err.txt"

              Start-Sleep -Seconds 15

              if ($ngrokProc.HasExited) {
                Write-Host "::error::Gagal restart ngrok. Keluar."
                exit 1
              }

              Write-Host "Ngrok berhasil di-restart. URL mungkin berubah!"
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 10
              $newUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'tcp' }).public_url
              Write-Host "URL baru: $newUrl"
            } catch {
              Write-Host "::error::Restart gagal: $($_.Exception.Message)"
              exit 1
            }
          } else {
            $remaining = [int](($endTime - (Get-Date)).TotalMinutes)
            $currentStatus = "OK - Sisa: $remaining menit"
            if ($currentStatus -ne $lastStatus) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Ngrok berjalan. Sisa waktu: $remaining menit."
              $lastStatus = $currentStatus
            }
          }

          Start-Sleep -Seconds $interval
        }

        Write-Host "Durasi keep-alive selesai."
        Write-Host "::endgroup::"

    - name: Cleanup
      if: always()
      shell: pwsh
      run: |
        Write-Host "::group::Cleanup"

        Write-Host "Menghentikan proses ngrok..."
        Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        Write-Host "Menghentikan HTTP server..."
        Get-Process -Name "python" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        Write-Host "Menghapus file sementara..."
        Remove-Item "ngrok.zip","ngrok_log.txt","ngrok_err.txt","ngrok_recover.txt","ngrok_recover_err.txt" -Force -ErrorAction SilentlyContinue
        Remove-Item ".\ngrok" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Menghapus firewall rules..."
        Remove-NetFirewallRule -DisplayName "Allow Ngrok Outbound" -ErrorAction SilentlyContinue
        Remove-NetFirewallRule -DisplayName "Allow Ngrok Inbound" -ErrorAction SilentlyContinue
        Remove-NetFirewallRule -DisplayName "Allow RDP 3389" -ErrorAction SilentlyContinue

        Write-Host "Cleanup selesai."
        Write-Host "::endgroup::"
