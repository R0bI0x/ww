# .github/workflows/main.yml
name: Windows RDP via bore.pub

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durasi sesi (jam, max 6)'
        required: true
        default: '6'
        type: string
      enable_http_tunnel:
        description: 'Aktifkan HTTP tunnel tambahan (file sharing)'
        required: true
        default: true
        type: boolean
      notify_discord:
        description: 'Kirim info koneksi ke Discord webhook'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  RDP_USER: admin
  RDP_PASS: ${{ secrets.RDP_PASS }}
  DURATION_HOURS: ${{ inputs.duration_hours }}
  ENABLE_HTTP_TUNNEL: ${{ inputs.enable_http_tunnel }}
  NOTIFY_DISCORD: ${{ inputs.notify_discord }}
  BORE_SERVER: bore.pub

jobs:
  bore-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Validate Configuration
      shell: pwsh
      run: |
        Write-Host "::group::Validasi Konfigurasi"

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
          "RDP_PASS=p@ssw0rd!" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:RDP_PASS = "p@ssw0rd!"
          Write-Host "RDP_PASS tidak di-set, pakai default."
        }

        $dur = [int]$env:DURATION_HOURS
        if ($dur -lt 1 -or $dur -gt 6) {
          Write-Host "::warning::Durasi $dur jam di luar rentang 1-6 jam. Di-clamp ke 6 jam."
          $dur = [math]::Min([math]::Max($dur, 1), 6)
          "DURATION_HOURS=$dur" | Out-File -FilePath $env:GITHUB_ENV -Append
        }

        Write-Host "Tunnel service  : bore.pub (gratis, tanpa akun)"
        Write-Host "Runner OS       : $env:RUNNER_OS"
        Write-Host "RDP User        : $env:RDP_USER"
        Write-Host "Durasi          : $dur jam"
        Write-Host "HTTP Tunnel     : $env:ENABLE_HTTP_TUNNEL"
        Write-Host "Validasi berhasil."
        Write-Host "::endgroup::"

    - name: System Optimization and Info
      shell: pwsh
      run: |
        Write-Host "::group::Informasi Sistem"
        Write-Host "OS          : $((Get-CimInstance Win32_OperatingSystem).Caption)"
        Write-Host "CPU         : $((Get-CimInstance Win32_Processor).Name)"
        Write-Host "RAM         : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)) GB"
        Write-Host "Free Disk C : $([math]::Round((Get-PSDrive C).Free / 1GB, 2)) GB"
        Write-Host "::endgroup::"

        Write-Host "::group::Optimasi Sistem"
        Set-Service -Name "wuauserv" -StartupType Disabled -ErrorAction SilentlyContinue
        Stop-Service -Name "wuauserv" -Force -ErrorAction SilentlyContinue

        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          Write-Host "Windows Defender realtime protection dimatikan."
        } catch {
          Write-Host "Tidak bisa mematikan Defender (mungkin diproteksi)."
        }

        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
        powercfg /hibernate off 2>$null
        Write-Host "Power plan High Performance + hibernasi mati."
        Write-Host "::endgroup::"

    - name: Setup Windows Remote Desktop
      shell: pwsh
      run: |
        Write-Host "::group::Setup RDP"
        Write-Host "::add-mask::$env:RDP_PASS"

        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        if ("$env:RDP_USER" -eq "runneradmin") {
          Write-Host "Warning: Menggunakan default user account!"
          Set-LocalUser -Name $env:RDP_USER -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
        } else {
          $existingUser = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue
          if ($existingUser) {
            Write-Host "User $env:RDP_USER sudah ada, update password."
            Set-LocalUser -Name "$env:RDP_USER" -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
          } else {
            New-LocalUser -Name "$env:RDP_USER" -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force) *>$null
            Add-LocalGroupMember -Group "Administrators" -Member "$env:RDP_USER"
            Enable-LocalUser -Name "$env:RDP_USER"
            Write-Host "User $env:RDP_USER dibuat dan ditambahkan ke Administrators."
          }
        }

        icacls "C:\Windows\Temp" /grant "$env:RDP_USER`:F" *>$null
        icacls "C:\Windows\installer" /grant "$env:RDP_USER`:F" *>$null

        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxDisconnectionTime" -Value 0 -ErrorAction SilentlyContinue

        Write-Host "Setup RDP selesai."
        Write-Host "::endgroup::"

    - name: Time Synchronization
      shell: pwsh
      run: |
        Write-Host "::group::Sinkronisasi Waktu"
        Set-Service -Name "W32Time" -StartupType Automatic -ErrorAction Stop *>$null
        Restart-Service W32Time *>$null
        w32tm /resync /force *>$null
        w32tm /config /manualpeerlist:"time.windows.com,time.google.com" /syncfromflags:manual /reliable:yes /update *>$null
        Restart-Service W32Time *>$null
        Start-Sleep -Seconds 3
        Write-Host "Waktu sistem: $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
        Write-Host "::endgroup::"

    - name: Cleanup Temp Files
      shell: pwsh
      run: |
        Write-Host "::group::Cleanup Temp Files"
        $paths = @(
          "$env:TEMP\*",
          "C:\Windows\Temp\*",
          "C:\Windows\Prefetch\*",
          "C:\Users\Public\Desktop\*"
        )
        foreach ($p in $paths) {
          Get-ChildItem $p -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }
        (New-Object -ComObject Shell.Application).Namespace(0xA).Items() |
          ForEach-Object { Remove-Item $_.Path -Recurse -Force -Confirm:$false -ErrorAction SilentlyContinue }
        (New-Object -ComObject Shell.Application).minimizeall()
        diskperf -Y *>$null
        Write-Host "Cleanup selesai."
        Write-Host "::endgroup::"

    - name: Download bore CLI
      shell: pwsh
      run: |
        Write-Host "::group::Download bore CLI"
        # Ambil rilis terbaru via GitHub API (asset Windows x64)
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -Headers @{ "User-Agent" = "GitHubActions" }
        Write-Host "Rilis terbaru: $($release.tag_name)"

        $asset = $release.assets | Where-Object { $_.name -match "x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1
        if (-not $asset) {
          Write-Host "::error::Asset Windows tidak ditemukan di rilis $($release.tag_name)."
          exit 1
        }
        Write-Host "Mengunduh: $($asset.name)"

        Invoke-WebRequest $asset.browser_download_url -OutFile "bore.zip"
        Expand-Archive "bore.zip" -DestinationPath ".\bore" -Force

        # Cari bore.exe (kadang ada di subfolder)
        $boreExe = Get-ChildItem ".\bore" -Recurse -Filter "bore.exe" | Select-Object -First 1
        if (-not $boreExe) {
          Write-Host "::error::bore.exe tidak ditemukan setelah ekstrak."
          exit 1
        }
        # Pindahkan ke root folder .\bore agar path konsisten
        if ($boreExe.DirectoryName -ne (Resolve-Path ".\bore").Path) {
          Move-Item $boreExe.FullName ".\bore\bore.exe" -Force
        }

        Write-Host "Versi bore:"
        .\bore\bore.exe --version
        Write-Host "::endgroup::"

    - name: Configure Firewall for bore
      shell: pwsh
      run: |
        Write-Host "::group::Konfigurasi Firewall"
        $borePath = "$PWD\bore\bore.exe"
        New-NetFirewallRule -DisplayName "Allow bore Outbound" -Direction Outbound -Program $borePath -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Allow bore Inbound" -Direction Inbound -Program $borePath -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Allow RDP 3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue
        Write-Host "Firewall rules ditambahkan."
        Write-Host "::endgroup::"

    # ============================================================
    # Helper: jalankan bore dan parse port publik dari output
    # bore menulis log ke stderr dengan format:
    #   ... INFO bore_cli::client: listening on bore.pub:12345
    # ============================================================
    - name: Start bore TCP Tunnel for RDP
      id: rdp_tunnel
      shell: pwsh
      run: |
        Write-Host "::group::Start bore TCP Tunnel (RDP)"
        $maxRetries = 5
        $retryCount = 0
        $success = $false
        $publicPort = $null

        while (-not $success -and $retryCount -lt $maxRetries) {
          Write-Host "--- Percobaan ke-$(($retryCount + 1)) dari $maxRetries ---"

          Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "bore_out.txt","bore_err.txt" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "Menjalankan: bore local 3389 --to $env:BORE_SERVER"
          $boreProc = Start-Process -FilePath ".\bore\bore.exe" `
            -ArgumentList "local 3389 --to $env:BORE_SERVER" `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput "bore_out.txt" `
            -RedirectStandardError "bore_err.txt"

          # Tunggu bore konek dan print port (max 30 detik)
          $wait = 0
          while (-not $publicPort -and $wait -lt 30) {
            Start-Sleep -Seconds 2
            $wait += 2

            if ($boreProc.HasExited) {
              Write-Host "::warning::Proses bore mati (exit code $($boreProc.ExitCode))."
              break
            }

            $combined = ""
            if (Test-Path "bore_out.txt") { $combined += (Get-Content "bore_out.txt" -Raw -ErrorAction SilentlyContinue) }
            if (Test-Path "bore_err.txt") { $combined += (Get-Content "bore_err.txt" -Raw -ErrorAction SilentlyContinue) }

            $m = [regex]::Match($combined, "bore\.pub:(\d+)")
            if ($m.Success) {
              $publicPort = $m.Groups[1].Value
            }
          }

          if ($publicPort) {
            $success = $true
            Write-Host "Port publik diperoleh: $publicPort"

            # Test koneksi ke port publik
            Write-Host "Menguji koneksi ke $env:BORE_SERVER`:$publicPort ..."
            $testResult = Test-NetConnection -ComputerName $env:BORE_SERVER -Port ([int]$publicPort) -WarningAction SilentlyContinue
            if ($testResult.TcpTestSucceeded) {
              Write-Host "Koneksi TCP ke bore.pub berhasil."
            } else {
              Write-Host "::warning::Test-NetConnection gagal, tapi port sudah di-assign. Lanjut."
            }
          } else {
            Write-Host "Gagal mendapatkan port publik dari bore."
            Write-Host "--- stdout ---"
            Get-Content "bore_out.txt" -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content "bore_err.txt" -ErrorAction SilentlyContinue
            Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force
            $retryCount++
            Start-Sleep -Seconds 5
          }
        }

        if (-not $success) {
          Write-Host "::error::Gagal membuat tunnel bore setelah $maxRetries percobaan. Server publik mungkin congested."
          exit 1
        }

        "RDP_HOST=$env:BORE_SERVER" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RDP_PORT=$publicPort" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RDP_FULL_ADDRESS=$env:BORE_SERVER`:$publicPort" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        Write-Host "::endgroup::"

    - name: Start bore HTTP Tunnel for File Sharing
      if: ${{ inputs.enable_http_tunnel }}
      id: http_tunnel
      shell: pwsh
      run: |
        Write-Host "::group::Start bore HTTP Tunnel (File Sharing)"

        $shareDir = "C:\RDP_Share"
        New-Item -ItemType Directory -Path $shareDir -Force | Out-Null
        "Selamat datang di RDP Share!" | Out-File "$shareDir\README.txt"

        Write-Host "Membuat HTTP server di port 8080..."
        $pythonProc = Start-Process -FilePath "python" -ArgumentList "-m http.server 8080 --directory `"$shareDir`"" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 3

        Write-Host "Menjalankan bore tunnel untuk port 8080..."
        $boreHttp = Start-Process -FilePath ".\bore\bore.exe" `
          -ArgumentList "local 8080 --to $env:BORE_SERVER" `
          -WindowStyle Hidden -PassThru `
          -RedirectStandardOutput "bore_http_out.txt" `
          -RedirectStandardError "bore_http_err.txt"

        $httpPort = $null
        $wait = 0
        while (-not $httpPort -and $wait -lt 30) {
          Start-Sleep -Seconds 2
          $wait += 2
          $combined = ""
          if (Test-Path "bore_http_out.txt") { $combined += (Get-Content "bore_http_out.txt" -Raw -ErrorAction SilentlyContinue) }
          if (Test-Path "bore_http_err.txt") { $combined += (Get-Content "bore_http_err.txt" -Raw -ErrorAction SilentlyContinue) }
          $m = [regex]::Match($combined, "bore\.pub:(\d+)")
          if ($m.Success) { $httpPort = $m.Groups[1].Value }
        }

        if ($httpPort) {
          $httpUrl = "http://$env:BORE_SERVER`:$httpPort"
          "HTTP_TUNNEL_URL=$httpUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HTTP_TUNNEL_URL=$httpUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "HTTP Tunnel: $httpUrl"
        } else {
          Write-Host "::warning::HTTP tunnel tidak bisa dibuat (server congested?)."
        }

        Write-Host "::endgroup::"

    - name: Display Connection Info
      shell: pwsh
      run: |
        Write-Host "::add-mask::$env:RDP_PASS"
        $sep = "=" * 60
        Write-Host $sep
        Write-Host "  WINDOWS RDP SIAP DIGUNAKAN (via bore.pub)"
        Write-Host $sep
        Write-Host "  Host         : $env:RDP_HOST"
        Write-Host "  Port         : $env:RDP_PORT"
        Write-Host "  Full Address : $env:RDP_FULL_ADDRESS"
        Write-Host "  Username     : $env:RDP_USER"
        Write-Host "  Password     : $env:RDP_PASS"
        Write-Host ""

        if ($env:HTTP_TUNNEL_URL) {
          Write-Host "  File Sharing (HTTP)"
          Write-Host "  URL          : $env:HTTP_TUNNEL_URL"
          Write-Host "  Folder       : C:\RDP_Share"
          Write-Host ""
        }

        Write-Host "  Durasi       : $env:DURATION_HOURS jam"
        Write-Host ""
        Write-Host "  Cara connect:"
        Write-Host "     1. Buka Remote Desktop Client (mstsc)"
        Write-Host "     2. Di field Computer, masukkan: $env:RDP_FULL_ADDRESS"
        Write-Host "        (atau jalankan: mstsc /v:$env:RDP_FULL_ADDRESS)"
        Write-Host "     3. Login dengan user: $env:RDP_USER"
        Write-Host $sep

        $lines = @(
          ("=" * 60),
          "WINDOWS RDP CONNECTION INFO (bore.pub)",
          ("=" * 60),
          "Host         : $env:RDP_HOST",
          "Port         : $env:RDP_PORT",
          "Full Address : $env:RDP_FULL_ADDRESS",
          "Username     : $env:RDP_USER",
          "Password     : $env:RDP_PASS",
          "HTTP Tunnel  : $env:HTTP_TUNNEL_URL",
          "Duration     : $env:DURATION_HOURS jam",
          "Generated    : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')",
          ("=" * 60)
        )
        $lines -join "`n" | Out-File -FilePath "rdp-info.txt" -Encoding UTF8

    - name: Send Discord Notification
      if: ${{ inputs.notify_discord && env.DISCORD_WEBHOOK != '' }}
      shell: pwsh
      run: |
        Write-Host "Mengirim notifikasi ke Discord..."
        $payload = @{
          username = "RDP Bot (bore.pub)"
          embeds = @(
            @{
              title = "Windows RDP Siap Digunakan (bore.pub)"
              color = 3066993
              fields = @(
                @{ name = "Host"; value = "$env:RDP_HOST"; inline = $true },
                @{ name = "Port"; value = "$env:RDP_PORT"; inline = $true },
                @{ name = "Username"; value = "$env:RDP_USER"; inline = $true },
                @{ name = "Password"; value = "||$env:RDP_PASS||"; inline = $true },
                @{ name = "Durasi"; value = "$env:DURATION_HOURS jam"; inline = $true }
              )
              footer = @{ text = "GitHub Actions - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" }
            }
          )
        } | ConvertTo-Json -Depth 10

        try {
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $payload -ContentType "application/json" -ErrorAction Stop
          Write-Host "Notifikasi Discord terkirim."
        } catch {
          Write-Host "::warning::Gagal kirim Discord: $($_.Exception.Message)"
        }

    - name: Upload Connection Info
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rdp-connection-info
        path: rdp-info.txt
        retention-days: 1

    - name: Keep Alive
      shell: pwsh
      run: |
        Write-Host "::group::Keep Alive"
        $duration = ([int]$env:DURATION_HOURS) * 3600
        $interval = 60
        $endTime = (Get-Date).AddSeconds($duration)
        $lastStatus = ""

        Write-Host "Menjaga sesi tetap hidup selama $env:DURATION_HOURS jam..."
        Write-Host "Berakhir pada: $($endTime.ToString('yyyy-MM-dd HH:mm:ss'))"

        while ((Get-Date) -lt $endTime) {
          $boreProcess = Get-Process -Name "bore" -ErrorAction SilentlyContinue

          if (-not $boreProcess) {
            Write-Host "::warning::Proses bore mati! Mencoba restart..."

            try {
              $boreProc = Start-Process -FilePath ".\bore\bore.exe" `
                -ArgumentList "local 3389 --to $env:BORE_SERVER" `
                -WindowStyle Hidden -PassThru `
                -RedirectStandardOutput "bore_recover_out.txt" `
                -RedirectStandardError "bore_recover_err.txt"

              Start-Sleep -Seconds 15

              if ($boreProc.HasExited) {
                Write-Host "::error::Gagal restart bore. Keluar."
                exit 1
              }

              # Parse port baru (bore.pub memberi port random tiap koneksi)
              $combined = ""
              if (Test-Path "bore_recover_out.txt") { $combined += (Get-Content "bore_recover_out.txt" -Raw) }
              if (Test-Path "bore_recover_err.txt") { $combined += (Get-Content "bore_recover_err.txt" -Raw) }
              $m = [regex]::Match($combined, "bore\.pub:(\d+)")
              if ($m.Success) {
                $newPort = $m.Groups[1].Value
                Write-Host "::warning::Bore di-restart. PORT BARU: $newPort (port lama $env:RDP_PORT tidak valid lagi!)"
              } else {
                Write-Host "::warning::Bore di-restart tapi port belum terdeteksi."
              }
            } catch {
              Write-Host "::error::Restart gagal: $($_.Exception.Message)"
              exit 1
            }
          } else {
            $remaining = [int](($endTime - (Get-Date)).TotalMinutes)
            $currentStatus = "OK - Sisa: $remaining menit"
            if ($currentStatus -ne $lastStatus) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] bore berjalan. Sisa waktu: $remaining menit."
              $lastStatus = $currentStatus
            }
          }

          Start-Sleep -Seconds $interval
        }

        Write-Host "Durasi keep-alive selesai."
        Write-Host "::endgroup::"

    - name: Cleanup
      if: always()
      shell: pwsh
      run: |
        Write-Host "::group::Cleanup"
        Write-Host "Menghentikan proses bore..."
        Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        Write-Host "Menghentikan HTTP server..."
        Get-Process -Name "python" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        Write-Host "Menghapus file sementara..."
        Remove-Item "bore.zip","bore_out.txt","bore_err.txt","bore_http_out.txt","bore_http_err.txt","bore_recover_out.txt","bore_recover_err.txt" -Force -ErrorAction SilentlyContinue
        Remove-Item ".\bore" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Menghapus firewall rules..."
        Remove-NetFirewallRule -DisplayName "Allow bore Outbound" -ErrorAction SilentlyContinue
        Remove-NetFirewallRule -DisplayName "Allow bore Inbound" -ErrorAction SilentlyContinue
        Remove-NetFirewallRule -DisplayName "Allow RDP 3389" -ErrorAction SilentlyContinue

        Write-Host "Cleanup selesai."
        Write-Host "::endgroup::"
